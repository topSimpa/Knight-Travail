<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knight-Travail</title>
  </head>
  <body>
    <header>
      <div class="header-box">
        <img id="header-logo" src="./images/logo.png" alt="Knight-Travail" />
      </div>
      <div class="contact-box"></div>
    </header>
    <main>
      <div class="content">
        <p class="instruction"></p>
        <div class="game-buttons">
          <button class="buttons" id="show">show path</button>
          <button class="buttons" id="cancel">cancel</button>
        </div>
        <div class="board-platform">
          <div class="pieces-container">
            <p>pieces</p>
            <div class="pieces"></div>
          </div>
          <div class="board"></div>
        </div>
      </div>
    </main>
  </body>
</html>
